naftiko: 1.0.0-alpha2
info:
  label: Walk Score API — Scores
  description: 'Walk Score API — Scores. 1 operations. Lead operation: Get Walk Score. Self-contained Naftiko capability covering
    one Walk Score business surface.'
  tags:
  - Walk Score
  - Scores
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WALK_SCORE_API_KEY: WALK_SCORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: walk-score-scores
    baseUri: https://api.walkscore.com
    description: Walk Score API — Scores business capability. Self-contained, no shared references.
    resources:
    - name: score
      path: /score
      operations:
      - name: getwalkscore
        method: GET
        description: Get Walk Score
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: wsapikey
          in: query
          type: string
          description: Your Walk Score API key
          required: true
        - name: lat
          in: query
          type: number
          description: Latitude of the location
          required: true
        - name: lon
          in: query
          type: number
          description: Longitude of the location
          required: true
        - name: address
          in: query
          type: string
          description: URL-encoded street address of the location
          required: true
        - name: transit
          in: query
          type: integer
          description: Set to 1 to include Transit Score in the response
        - name: bike
          in: query
          type: integer
          description: Set to 1 to include Bike Score in the response
        - name: format
          in: query
          type: string
          description: Response format. Defaults to XML if not specified
    authentication:
      type: apikey
      key: wsapikey
      value: '{{env.WALK_SCORE_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: walk-score-scores-rest
    port: 8080
    description: REST adapter for Walk Score API — Scores. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/score
      name: score
      description: REST surface for score.
      operations:
      - method: GET
        name: getwalkscore
        description: Get Walk Score
        call: walk-score-scores.getwalkscore
        with:
          wsapikey: rest.wsapikey
          lat: rest.lat
          lon: rest.lon
          address: rest.address
          transit: rest.transit
          bike: rest.bike
          format: rest.format
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: walk-score-scores-mcp
    port: 9090
    transport: http
    description: MCP adapter for Walk Score API — Scores. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-walk-score
      description: Get Walk Score
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: walk-score-scores.getwalkscore
      with:
        wsapikey: tools.wsapikey
        lat: tools.lat
        lon: tools.lon
        address: tools.address
        transit: tools.transit
        bike: tools.bike
        format: tools.format
      outputParameters:
      - type: object
        mapping: $.
