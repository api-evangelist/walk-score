naftiko: 1.0.0-alpha2
info:
  label: Walk Score Location Intelligence
  description: Workflow capability combining Walk Score and Transit APIs for comprehensive location intelligence. Enables
    applications to assess any location's walkability, transit accessibility, and bikeability in a unified workflow. Used
    by real estate platforms, city planners, commute calculators, and property search applications to provide complete transportation
    accessibility scoring.
  tags:
  - Walk Score
  - Location Intelligence
  - Walkability
  - Transit
  - Bikeability
  - Real Estate
  - Urban Planning
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    WALKSCORE_API_KEY: WALKSCORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: walk-score-api
    baseUri: https://api.walkscore.com
    description: Walk Score API for walkability, transit, and bike scores
    authentication:
      type: apikey
      key: wsapikey
      value: '{{WALKSCORE_API_KEY}}'
      placement: query
    resources:
    - name: scores
      path: /score
      description: Get Walk Score, Transit Score, and Bike Score for a location
      operations:
      - name: get-walk-score
        method: GET
        description: Get walkability, transit, and bike scores for a lat/lon location
        inputParameters:
        - name: lat
          in: query
          type: number
          required: true
          description: Latitude coordinate
        - name: lon
          in: query
          type: number
          required: true
          description: Longitude coordinate
        - name: address
          in: query
          type: string
          required: true
          description: URL-encoded street address
        - name: transit
          in: query
          type: integer
          required: false
          description: Set to 1 to include Transit Score
        - name: bike
          in: query
          type: integer
          required: false
          description: Set to 1 to include Bike Score
        - name: format
          in: query
          type: string
          required: false
          description: 'Response format: json or xml'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: walk-score-transit
    baseUri: https://transit.walkscore.com
    description: Walk Score Public Transit API for detailed transit data
    authentication:
      type: apikey
      key: wsapikey
      value: '{{WALKSCORE_API_KEY}}'
      placement: query
    resources:
    - name: transit-score
      path: /transit/score/
      description: Get Transit Score for a location
      operations:
      - name: get-transit-score
        method: GET
        description: Get Transit Score for a city location
        inputParameters:
        - name: lat
          in: query
          type: number
          required: true
          description: Latitude to score
        - name: lon
          in: query
          type: number
          required: true
          description: Longitude to score
        - name: city
          in: query
          type: string
          required: true
          description: City name
        - name: state
          in: query
          type: string
          required: false
          description: Two-letter state code (US cities)
        - name: country
          in: query
          type: string
          required: false
          description: ISO-3166 country code (non-US cities)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: stops-search
      path: /transit/search/stops/
      description: Search for nearby transit stops
      operations:
      - name: search-transit-stops
        method: GET
        description: Get up to 16 transit stops near a location with route info
        inputParameters:
        - name: lat
          in: query
          type: number
          required: true
          description: Search latitude
        - name: lon
          in: query
          type: number
          required: true
          description: Search longitude
        outputRawFormat: json
        outputParameters:
        - name: result
          type: array
          value: $.
    - name: network-search
      path: /transit/search/network/
      description: Get all transit routes and stops within one mile
      operations:
      - name: search-transit-network
        method: GET
        description: Get all routes and stops within one mile of a location
        inputParameters:
        - name: lat
          in: query
          type: number
          required: true
          description: Search latitude
        - name: lon
          in: query
          type: number
          required: true
          description: Search longitude
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: stop-details
      path: /transit/stop/{stopId}/
      description: Get details for a specific transit stop
      operations:
      - name: get-transit-stop
        method: GET
        description: Get details for a transit stop by ID
        inputParameters:
        - name: stopId
          in: path
          type: string
          required: true
          description: Stop identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: route-details
      path: /transit/route/{routeId}/
      description: Get details for a specific transit route
      operations:
      - name: get-transit-route
        method: GET
        description: Get details for a transit route by ID
        inputParameters:
        - name: routeId
          in: path
          type: string
          required: true
          description: Route identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: supported-cities
      path: /transit/supported/cities/
      description: Get list of supported cities
      operations:
      - name: list-supported-cities
        method: GET
        description: Get all cities supported by the Transit API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: array
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: walk-score-location-intelligence-api
    description: Unified REST API for Walk Score location intelligence and transit data.
    resources:
    - path: /v1/scores
      name: scores
      description: Get Walk Score, Transit Score, and Bike Score for a location
      operations:
      - method: GET
        name: get-walk-score
        description: Get all walkability scores for a location
        call: walk-score-api.get-walk-score
        with:
          lat: rest.lat
          lon: rest.lon
          address: rest.address
          transit: rest.transit
          bike: rest.bike
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/transit-scores
      name: transit-scores
      description: Get detailed Transit Score for a city location
      operations:
      - method: GET
        name: get-transit-score
        description: Get Transit Score with route summary for a city location
        call: walk-score-transit.get-transit-score
        with:
          lat: rest.lat
          lon: rest.lon
          city: rest.city
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/transit-stops
      name: transit-stops
      description: Find nearby transit stops
      operations:
      - method: GET
        name: search-transit-stops
        description: Get transit stops near a location
        call: walk-score-transit.search-transit-stops
        with:
          lat: rest.lat
          lon: rest.lon
        outputParameters:
        - type: array
          mapping: $.
    - path: /v1/transit-network
      name: transit-network
      description: Get transit network within one mile
      operations:
      - method: GET
        name: search-transit-network
        description: Get all routes and stops within one mile
        call: walk-score-transit.search-transit-network
        with:
          lat: rest.lat
          lon: rest.lon
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/transit-stops/{stopId}
      name: transit-stop-detail
      description: Get a specific transit stop
      operations:
      - method: GET
        name: get-transit-stop
        description: Get transit stop details
        call: walk-score-transit.get-transit-stop
        with:
          stopId: rest.stopId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/transit-routes/{routeId}
      name: transit-route-detail
      description: Get a specific transit route
      operations:
      - method: GET
        name: get-transit-route
        description: Get transit route details and geometry
        call: walk-score-transit.get-transit-route
        with:
          routeId: rest.routeId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cities
      name: supported-cities
      description: List cities with transit score support
      operations:
      - method: GET
        name: list-supported-cities
        description: Get all cities supported by Transit API
        call: walk-score-transit.list-supported-cities
        outputParameters:
        - type: array
          mapping: $.
  - type: mcp
    port: 9080
    namespace: walk-score-location-intelligence-mcp
    transport: http
    description: MCP server for AI-assisted Walk Score location intelligence workflows.
    tools:
    - name: get-location-scores
      description: Get Walk Score, Transit Score, and Bike Score for any address or coordinates. Returns walkability, transit
        accessibility, and bikeability in one call.
      hints:
        readOnly: true
        openWorld: true
      call: walk-score-api.get-walk-score
      with:
        lat: tools.lat
        lon: tools.lon
        address: tools.address
        transit: tools.transit
        bike: tools.bike
        format: json
      outputParameters:
      - type: object
        mapping: $.
    - name: get-transit-score
      description: Get detailed Transit Score with route count summary for a city location
      hints:
        readOnly: true
        openWorld: true
      call: walk-score-transit.get-transit-score
      with:
        lat: tools.lat
        lon: tools.lon
        city: tools.city
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
    - name: find-nearby-transit-stops
      description: Find public transit stops near any location with route details
      hints:
        readOnly: true
        openWorld: true
      call: walk-score-transit.search-transit-stops
      with:
        lat: tools.lat
        lon: tools.lon
      outputParameters:
      - type: array
        mapping: $.
    - name: get-transit-network
      description: Get all transit routes and stops within one mile of a location
      hints:
        readOnly: true
        openWorld: true
      call: walk-score-transit.search-transit-network
      with:
        lat: tools.lat
        lon: tools.lon
      outputParameters:
      - type: object
        mapping: $.
    - name: get-transit-stop-details
      description: Get details for a specific transit stop by ID
      hints:
        readOnly: true
        openWorld: false
      call: walk-score-transit.get-transit-stop
      with:
        stopId: tools.stopId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-transit-route-details
      description: Get details for a transit route including stops and route geometry
      hints:
        readOnly: true
        openWorld: false
      call: walk-score-transit.get-transit-route
      with:
        routeId: tools.routeId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-transit-cities
      description: Get the list of all cities supported by the Walk Score Transit API
      hints:
        readOnly: true
        openWorld: false
      call: walk-score-transit.list-supported-cities
      outputParameters:
      - type: array
        mapping: $.
