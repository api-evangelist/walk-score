naftiko: "1.0.0-alpha1"

info:
  label: "Walk Score Transit API"
  description: >-
    Shared capability definition for the Walk Score Public Transit API. Provides
    detailed transit data including transit scores, nearby stops, network routes,
    individual stop and route details, and supported cities.
  tags:
    - Walk Score
    - Public Transit
    - Transit Data
    - Transportation
    - Location Intelligence
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WALKSCORE_API_KEY: WALKSCORE_API_KEY

capability:
  consumes:
    - type: http
      namespace: walk-score-transit
      baseUri: https://transit.walkscore.com
      description: "Walk Score Public Transit API for detailed transit data"
      authentication:
        type: apikey
        key: wsapikey
        value: "{{WALKSCORE_API_KEY}}"
        placement: query
      resources:
        - name: transit-score
          path: /transit/score/
          description: "Get Transit Score for a location"
          operations:
            - name: get-transit-score
              method: GET
              description: "Get Transit Score for a city location"
              inputParameters:
                - name: lat
                  in: query
                  type: number
                  required: true
                  description: "Latitude to score"
                - name: lon
                  in: query
                  type: number
                  required: true
                  description: "Longitude to score"
                - name: city
                  in: query
                  type: string
                  required: true
                  description: "City name"
                - name: state
                  in: query
                  type: string
                  required: false
                  description: "Two-letter state code (US cities)"
                - name: country
                  in: query
                  type: string
                  required: false
                  description: "ISO-3166 country code (non-US cities)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: stops-search
          path: /transit/search/stops/
          description: "Search for nearby transit stops"
          operations:
            - name: search-transit-stops
              method: GET
              description: "Get up to 16 transit stops near a location with route info"
              inputParameters:
                - name: lat
                  in: query
                  type: number
                  required: true
                  description: "Search latitude"
                - name: lon
                  in: query
                  type: number
                  required: true
                  description: "Search longitude"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
        - name: network-search
          path: /transit/search/network/
          description: "Get all transit routes and stops within one mile"
          operations:
            - name: search-transit-network
              method: GET
              description: "Get all routes and stops within one mile of a location"
              inputParameters:
                - name: lat
                  in: query
                  type: number
                  required: true
                  description: "Search latitude"
                - name: lon
                  in: query
                  type: number
                  required: true
                  description: "Search longitude"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: stop-details
          path: /transit/stop/{stopId}/
          description: "Get details for a specific transit stop"
          operations:
            - name: get-transit-stop
              method: GET
              description: "Get details for a transit stop by ID"
              inputParameters:
                - name: stopId
                  in: path
                  type: string
                  required: true
                  description: "Stop identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: route-details
          path: /transit/route/{routeId}/
          description: "Get details for a specific transit route"
          operations:
            - name: get-transit-route
              method: GET
              description: "Get details for a transit route by ID"
              inputParameters:
                - name: routeId
                  in: path
                  type: string
                  required: true
                  description: "Route identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: supported-cities
          path: /transit/supported/cities/
          description: "Get list of supported cities"
          operations:
            - name: list-supported-cities
              method: GET
              description: "Get all cities supported by the Transit API"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

  exposes:
    - type: rest
      port: 8121
      namespace: walk-score-transit-rest
      resources:
        - path: /v1/transit-scores
          name: transit-scores
          description: "Get Transit Scores for locations"
          operations:
            - method: GET
              name: get-transit-score
              description: "Get Transit Score for a city location"
              call: "walk-score-transit.get-transit-score"
              with:
                lat: "rest.lat"
                lon: "rest.lon"
                city: "rest.city"
                state: "rest.state"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/transit-stops
          name: transit-stops
          description: "Search for nearby transit stops"
          operations:
            - method: GET
              name: search-transit-stops
              description: "Get transit stops near a location"
              call: "walk-score-transit.search-transit-stops"
              with:
                lat: "rest.lat"
                lon: "rest.lon"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/transit-network
          name: transit-network
          description: "Get transit network near a location"
          operations:
            - method: GET
              name: search-transit-network
              description: "Get all transit routes and stops within one mile"
              call: "walk-score-transit.search-transit-network"
              with:
                lat: "rest.lat"
                lon: "rest.lon"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/transit-stops/{stopId}
          name: transit-stop-detail
          description: "Get a specific transit stop"
          operations:
            - method: GET
              name: get-transit-stop
              description: "Get transit stop details by ID"
              call: "walk-score-transit.get-transit-stop"
              with:
                stopId: "rest.stopId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/transit-routes/{routeId}
          name: transit-route-detail
          description: "Get a specific transit route"
          operations:
            - method: GET
              name: get-transit-route
              description: "Get transit route details by ID"
              call: "walk-score-transit.get-transit-route"
              with:
                routeId: "rest.routeId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cities
          name: supported-cities
          description: "List supported transit cities"
          operations:
            - method: GET
              name: list-supported-cities
              description: "Get all cities with transit score support"
              call: "walk-score-transit.list-supported-cities"
              outputParameters:
                - type: array
                  mapping: "$."

    - type: mcp
      port: 9121
      namespace: walk-score-transit-mcp
      transport: http
      tools:
        - name: get-transit-score
          description: "Get the Transit Score for a location in a specific city"
          hints:
            readOnly: true
            openWorld: true
          call: "walk-score-transit.get-transit-score"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
            city: "tools.city"
            state: "tools.state"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-nearby-transit-stops
          description: "Find public transit stops near a location with route information"
          hints:
            readOnly: true
            openWorld: true
          call: "walk-score-transit.search-transit-stops"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-transit-network
          description: "Get complete transit network (all routes and stops) within one mile of a location"
          hints:
            readOnly: true
            openWorld: true
          call: "walk-score-transit.search-transit-network"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-transit-stop-details
          description: "Get details for a specific transit stop by its ID"
          hints:
            readOnly: true
            openWorld: false
          call: "walk-score-transit.get-transit-stop"
          with:
            stopId: "tools.stopId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-transit-route-details
          description: "Get details for a specific transit route by its ID including stops and geometry"
          hints:
            readOnly: true
            openWorld: false
          call: "walk-score-transit.get-transit-route"
          with:
            routeId: "tools.routeId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-transit-supported-cities
          description: "Get the list of all cities supported by the Walk Score Transit API"
          hints:
            readOnly: true
            openWorld: false
          call: "walk-score-transit.list-supported-cities"
          outputParameters:
            - type: array
              mapping: "$."
