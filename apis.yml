aid: walk-score
name: Walk Score
description: >-
  Walk Score measures the walkability, transit accessibility, and bikeability of any address in the United States and
  Canada. The Walk Score API returns Walk Score, Transit Score, and Bike Score for any geographic location, supporting
  real estate platforms, commute calculators, urban planning tools, and location intelligence applications. The Public
  Transit API provides detailed transit data including nearby stops, route networks, and supported cities, enabling
  comprehensive transportation accessibility analysis.
